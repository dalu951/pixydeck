[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixydeck"
version = "0.5.3"
description = "EMEET PixyDeck: unofficial Linux control suite for the EMEET PIXY webcam (PTZ, AI focus, auto-framing, background replacement, virtual camera)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
  {name = "dalu951"},
  {name = "Rolf Obermaier"},  # original emeet-pixy-control
]
maintainers = [
  {name = "dalu951"},
]
keywords = ["EMEET", "PIXY", "webcam", "Linux", "PTZ", "v4l2", "v4l2loopback"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  # PySide6 without the web engine/PDF add-ons PixyDeck does not use.
  "PySide6-Essentials>=6.8,<7",
  "PySide6-Addons>=6.8,<7",
]

[project.optional-dependencies]
# Auto-framing, face overlay and the processed virtual camera.
ai = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.17",
]
# Same AI features, with NVIDIA CUDA acceleration for the matting model.
# Use this instead of [ai] on a machine with a compatible NVIDIA driver.
gpu = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  # Keep ONNX Runtime and CuPy on one self-contained CUDA 12 stack. The
  # extras install cuBLAS/cuDNN/NVRTC and headers; a driver alone is not a
  # complete user-space CUDA runtime.
  "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.24",
  "cupy-cuda12x[ctk]>=14.0,<15",
]

[project.urls]
Homepage = "https://github.com/dalu951/pixydeck"
Issues = "https://github.com/dalu951/pixydeck/issues"

[project.scripts]
pixydeck = "pixydeck.gui:main"
pixydeck-cli = "pixydeck.backend:main"
pixydeck-gpu-benchmark = "pixydeck.gpu_benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pixydeck = ["assets/*.svg", "assets/*.onnx"]

[tool.coverage.run]
branch = true
source = ["src/pixydeck"]
# These paths need an actual NVIDIA device; discovery and CPU fallback are
# covered in CI, while docs/TESTING.md defines the opt-in hardware benchmark.
omit = ["src/pixydeck/cuda.py", "src/pixydeck/gpu_benchmark.py"]

[tool.coverage.report]
skip_empty = true
fail_under = 95
