name: Python checks

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[ai]"
      - name: Compile sources
        run: python -m compileall -q src
      - name: Docs up to date
        run: QT_QPA_PLATFORM=offscreen python tools/gen_docs.py --check
      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen PYTHONPATH=src python -m unittest discover -s tests -v
