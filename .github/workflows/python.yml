name: Python checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0
      - name: Install
        run: python -m pip install ".[ai]" pyflakes coverage
      - name: Lint
        run: python -m pyflakes src tests tools
      - name: Docs up to date
        # tomllib (used by the generator) is part of the standard library from 3.11.
        if: matrix.python-version != '3.10'
        run: QT_QPA_PLATFORM=offscreen python tools/gen_docs.py --check
      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen PYTHONPATH=src python -m coverage run -m unittest discover -s tests -v
      - name: Coverage
        run: python -m coverage report
